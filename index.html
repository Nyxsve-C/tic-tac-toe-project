<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <dialog class="namesDialog" id="namesDialog" closedby="any">
        <form class="namesForm" method="dialog">
            <h2 class="namesHeading">New player names</h2>
            <button class="dialogCloseButton" type="button" command="close" commandfor="namesDialog">
                <img src="./assets/images/close.svg" alt="close dialog icon">
            </button>
            <label for="playerOneInput">Player 1</label>
            <input type="text" id="playerOneInput" required>
            <label for="playerTwoInput">Player 2</label>
            <input type="text" id="playerTwoInput" required>
            <button class="doneButton" type="submit" formmethod="dialog">Done</button>
        </form>
    </dialog>
    <h1 class="heading">Tic-tac-toe</h1>
    <div class="controls">
        <button class="setNames" command="show-modal" commandfor="namesDialog">Set player names</button>
        <button class="newGame">Start new game</button>
    </div>
    <p class="gameResult"></p>
    <div class="board">
        <button class="box" data-row="0" data-column="0"></button>
        <button class="box" data-row="0" data-column="1"></button>
        <button class="box" data-row="0" data-column="2"></button>
        <button class="box" data-row="1" data-column="0"></button>
        <button class="box" data-row="1" data-column="1"></button>
        <button class="box" data-row="1" data-column="2"></button>
        <button class="box" data-row="2" data-column="0"></button>
        <button class="box" data-row="2" data-column="1"></button>
        <button class="box" data-row="2" data-column="2"></button>
    </div>
</body>
</html>
